# MCUboot OTA profile (ESP32).
#
# Requires a one-time flash of the MCUboot bootloader and this application to
# slot0; afterwards the running app can write slot1 over HTTP and request an
# upgrade. Enable with:
#   -DEXTRA_CONF_FILE="psram.conf;ota.conf"
CONFIG_ESP_SIMPLE_BOOT=n
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_STREAM_FLASH=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y
CONFIG_REBOOT=y
