# WROVER-IE / ESP32-WROVER-E (N16R8 or similar) profile.
#
# Enable the 8 MB SPI RAM and place the stereo Q1.31 output reservoir there.
# 65536 frames (~1.5 s of 44.1 kHz stereo source) gives the jitter buffer needed
# to ride out Wi-Fi throughput dips that starve the 4096-frame WROOM profile.
#
# Build with:
#   cmake ... -DEXTRA_CONF_FILE=psram.conf -DEXTRA_DTC_OVERLAY_FILE=psram.overlay

CONFIG_ESP_SPIRAM=y
CONFIG_ESP_SPIRAM_MEMTEST=y
CONFIG_ESP_SPIRAM_HEAP_SIZE=2097152

CONFIG_EAF_BOARD_USE_PSRAM=y
CONFIG_EAF_BOARD_RESERVOIR_FRAMES=65536

# The larger PSRAM jitter buffer targets stereo; override the WROOM mono default.
CONFIG_EAF_BOARD_MONO=n
