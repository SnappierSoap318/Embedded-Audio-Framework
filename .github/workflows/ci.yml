name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Match the toolchain used by the project's clang-format/clang-tidy config.
  LLVM_VERSION: "22"

jobs:
  build-test:
    name: Build and test (host)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- "$LLVM_VERSION"
          sudo apt-get install -y cmake ninja-build python3 clang-"$LLVM_VERSION"
      - name: Configure
        run: |
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang-"$LLVM_VERSION" \
            -DEAF_ENABLE_ALSA=OFF \
            -DBUILD_TESTING=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Build
        run: cmake --build build-ci
      - name: Test
        run: ctest --test-dir build-ci --output-on-failure

  sanitizers:
    name: Address and UB sanitizers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- "$LLVM_VERSION"
          sudo apt-get install -y cmake ninja-build python3 clang-"$LLVM_VERSION"
      - name: Configure
        run: |
          cmake -S . -B build-asan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang-"$LLVM_VERSION" \
            -DEAF_SANITIZE=ON \
            -DEAF_ENABLE_ALSA=OFF \
            -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build-asan
      - name: Test
        run: ctest --test-dir build-asan --output-on-failure

  lint:
    name: Format and static analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- "$LLVM_VERSION"
          sudo apt-get install -y cmake ninja-build python3 \
            clang-"$LLVM_VERSION" clang-tools-"$LLVM_VERSION" \
            clang-format-"$LLVM_VERSION" clang-tidy-"$LLVM_VERSION"
          sudo ln -sf "/usr/bin/clang-$LLVM_VERSION" /usr/local/bin/clang
          sudo ln -sf "/usr/bin/clangd-$LLVM_VERSION" /usr/local/bin/clangd
          sudo ln -sf "/usr/bin/clang-format-$LLVM_VERSION" /usr/local/bin/clang-format
          sudo ln -sf "/usr/bin/clang-tidy-$LLVM_VERSION" /usr/local/bin/clang-tidy
      - name: Configure
        run: |
          cmake -S . -B build-lint -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DEAF_ENABLE_ALSA=OFF \
            -DBUILD_TESTING=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Lint
        run: python3 tools/check_code.py build-lint
